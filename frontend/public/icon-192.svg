<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="192" height="192" rx="40" fill="url(#bg)"/>
  <!-- Buku / academic cap icon -->
  <g fill="white" opacity="0.95">
    <!-- Topi wisuda -->
    <polygon points="96,44 148,68 96,92 44,68" fill="white"/>
    <ellipse cx="96" cy="68" rx="52" ry="12" fill="rgba(255,255,255,0.2)"/>
    <!-- Badan topi -->
    <rect x="84" y="88" width="24" height="8" rx="4" fill="white"/>
    <!-- Tali rumbai -->
    <line x1="148" y1="68" x2="148" y2="96" stroke="white" stroke-width="3"/>
    <circle cx="148" cy="100" r="5" fill="white"/>
    <!-- Buku bawah -->
    <rect x="58" y="108" width="76" height="44" rx="8" fill="rgba(255,255,255,0.25)"/>
    <rect x="62" y="112" width="68" height="36" rx="6" fill="rgba(255,255,255,0.15)"/>
    <!-- Garis buku -->
    <line x1="66" y1="122" x2="122" y2="122" stroke="white" stroke-width="2.5" opacity="0.8"/>
    <line x1="66" y1="130" x2="116" y2="130" stroke="white" stroke-width="2.5" opacity="0.6"/>
    <line x1="66" y1="138" x2="108" y2="138" stroke="white" stroke-width="2.5" opacity="0.4"/>
    <!-- Spine buku -->
    <rect x="90" y="108" width="4" height="44" rx="2" fill="rgba(255,255,255,0.4)"/>
  </g>
</svg>
